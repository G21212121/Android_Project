# Project-wide Gradle settings
# ─────────────────────────────────────────────────────────────
# Zwiększa limit pamięci JVM dla Gradle (ważne przy dużych projektach)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Włącza równoległe budowanie modułów
org.gradle.parallel=true

# Włącza cache konfiguracji (szybsze przebudowy)
org.gradle.configuration-cache=true

# AndroidX – wymagane dla nowoczesnych projektów
android.useAndroidX=true

# Styl kodu Kotlin (oficjalny)
kotlin.code.style=official

# Zmniejsza czas budowania przez eliminację transitive R class
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
